<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral no computador, barra inferior no celular; conteúdo em coluna única com painéis. */
:root{
  --bg:#F1F4F2;--surface:#FFFFFF;--surface2:#E8EDEA;--ink:#14201D;--muted:#586864;--line:#D3DBD7;
  --accent:#0B6E66;--accent-ink:#FFFFFF;--accent-soft:#D5EDE9;
  --good:#1F8A4C;--warn:#A86A12;--crit:#BE3A2C;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513;--surface:#17211F;--surface2:#212C29;--ink:#E5EEEA;--muted:#91A39D;--line:#2C3935;
  --accent:#4FD1C0;--accent-ink:#06201C;--accent-soft:#143934;
  --good:#55C98A;--warn:#E3B25A;--crit:#F0786B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513;--surface:#17211F;--surface2:#212C29;--ink:#E5EEEA;--muted:#91A39D;--line:#2C3935;
  --accent:#4FD1C0;--accent-ink:#06201C;--accent-soft:#143934;
  --good:#55C98A;--warn:#E3B25A;--crit:#F0786B;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.1}h2{font-size:1.15rem}h3{font-size:1rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;min-height:100vh}
nav.side{position:sticky;top:0;align-self:start;padding:20px 0;display:flex;flex-direction:column;gap:4px;height:100vh}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;padding:4px 10px 16px}
.brand small{display:block;font:500 .72rem var(--f-body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nb{display:flex;align-items:center;gap:10px;background:none;border:0;padding:9px 10px;border-radius:var(--r);text-align:left;color:var(--muted);font-weight:500}
.nb svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb:hover{background:var(--surface2);color:var(--ink)}
.nb[aria-current=page]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sp{flex:1}
.status{font-size:.78rem;color:var(--muted);padding:8px 10px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--warn)}
main{padding:22px 0 80px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;font-size:.9rem}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qa{display:flex;gap:8px}
.qa input{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea,input:not([type]){background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--c,var(--muted));background:none;flex:none;display:grid;place-items:center;margin-top:1px;padding:0}
.task.done .chk{background:var(--c)}
.chk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tmain{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ttl{font-weight:500;overflow-wrap:anywhere}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.chip{border-radius:99px;padding:1px 9px;background:color-mix(in srgb,var(--c,var(--muted)) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--muted)) 45%,transparent);color:var(--ink);font-size:.75rem;white-space:nowrap}
.due.late{color:var(--crit);font-weight:600}
.pr{font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.pr1{color:var(--muted)}.pr2{color:var(--good)}.pr3{color:var(--warn)}.pr4{color:var(--crit)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:8px;padding:6px 12px;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.empty{color:var(--muted);padding:14px 0;text-align:center;font-size:.92rem}
.now{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.now .t{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:color-mix(in srgb,var(--accent) calc(var(--l)*25%),var(--surface2))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--bg);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted)}
/* agenda */
.ag-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ag-title{font-family:var(--f-display);font-weight:600;font-size:1.05rem;flex:1;min-width:140px}
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cal-in{min-width:var(--minw,640px)}
.cal-head{display:grid;grid-template-columns:48px repeat(var(--n),1fr);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.cal-head div{padding:8px 4px;text-align:center;font-size:.8rem;color:var(--muted)}
.cal-head b{display:block;font-size:1.05rem;color:var(--ink);font-family:var(--f-display)}
.cal-head .td b{color:var(--accent)}
.cal-body{display:grid;grid-template-columns:48px repeat(var(--n),1fr);position:relative}
.hours div{height:48px;font-size:.7rem;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.col.drop{background-color:var(--accent-soft)}
.evb{position:absolute;border-radius:6px;padding:2px 6px;font-size:.76rem;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface));text-align:left;cursor:grab;line-height:1.25;display:flex;gap:4px;align-items:flex-start}
.evb span{min-width:0;flex:1}
.evb em{font-style:normal;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);display:block}
.evb.dn{opacity:.6}
.evb.dn b{text-decoration:line-through}
.mini{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--c);background:none;flex:none;padding:0;margin-top:1px}
.evb.dn .mini{background:var(--c)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--crit);z-index:2;pointer-events:none}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.month .h{background:var(--surface2);text-align:center;padding:6px;font-size:.78rem;color:var(--muted)}
.mc{background:var(--surface);min-height:84px;padding:4px;text-align:left;border:0;border-radius:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.mc:hover{background:var(--surface2)}
.mc.out{color:var(--muted);background:var(--bg)}
.mc.td .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;width:22px;height:22px;display:grid;place-items:center}
.mc .n{font-size:.8rem;font-weight:600;width:22px;height:22px;display:grid;place-items:center}
.mc .e{font-size:.68rem;border-radius:4px;padding:0 4px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.pool .chip{cursor:grab;background:var(--surface2);border-color:var(--line)}
/* estudos */
.timer{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.tm{font-family:var(--f-mono);font-size:3.2rem;font-weight:500;letter-spacing:-.02em;line-height:1}
.ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p,0)*1%),var(--surface2) 0)}
.ring>div{width:186px;height:186px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.bar{display:flex;align-items:center;gap:10px;font-size:.88rem}
.bar .lb{width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .prog{flex:1}
.bar .v{width:82px;text-align:right;color:var(--muted);font-size:.8rem}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.chart .ax{stroke:var(--line);stroke-width:1}
svg.chart rect.b{fill:var(--accent)}
svg.chart rect.b.o{fill:color-mix(in srgb,var(--accent) 45%,var(--surface))}
/* modal */
.ov{position:fixed;inset:0;background:rgb(8 14 12/.55);display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;border:1px solid var(--line)}
.md header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px}
.md .x{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--muted)}
.mb{padding:8px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.md footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:30px;height:30px;border-radius:8px;border:2px solid transparent;background:var(--surface2);padding:0;font-size:1rem;display:grid;place-items:center}
.sw.c button{background:var(--c)}
.sw button.on{border-color:var(--ink)}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg label{display:flex;gap:5px;align-items:center;font-size:.85rem;background:var(--surface2);border-radius:99px;padding:3px 10px;cursor:pointer}
.tg input{width:auto}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:70;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0/.25)}
.fab{display:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.minitimer{display:none;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:6px 12px;font-weight:600;font-size:.85rem;align-items:center;gap:6px}
.minitimer.on{display:inline-flex}
@media (max-width:820px){
  .app{display:block}
  nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;justify-content:space-around;gap:0}
  .brand,.status,.sp,.side .newbtn{display:none}
  .nb{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px;flex:1;align-items:center;text-align:center}
  main{padding-top:16px;padding-bottom:110px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:1.9rem;z-index:41;box-shadow:0 4px 16px rgb(0 0 0/.3)}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.6rem}
  .tm{font-size:2.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <nav class="side" id="nav" aria-label="Navegação principal"></nav>

</div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const toMin=t=>{const p=t.split(':').map(Number);return p[0]*60+p[1]};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];

const fmtDur=min=>{min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?(m?h+'h'+pad(m):h+'h'):m+'min'};
const COLORS=['#3B82F6','#8B5CF6','#F59E0B','#10B981','#EF4444','#EC4899','#0EA5A4','#64748B','#F97316','#84CC16'];

 hoje:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

const KEY='meu-planejador-v1';
function seed(){
  const t=today(),at=(d,h,m)=>{const p=parseD(addDays(t,d));p.setHours(h,m,0,0);return p.getTime()};
  const areas=[
    {id:'a-trab',nome:'Trabalho',cor:'#3B82F6',icone:'💼'},{id:'a-est',nome:'Estudos',cor:'#8B5CF6',icone:'📚'},

function timerStart(sid,topic,mode){state.timer={subjectId:sid,topic,mode,phase:'foco',running:true,since:Date.now(),before:0,focus:0,cycles:0,startTs:Date.now()};save();beep('done');render()}

function timerStop(keep){

}
function timerTick(){
  const T=tmr(),mt=$('#minit');

    if(T.phase==='foco'){T.focus+=tg;T.cycles++;T.phase=T.cycles%4===0?'longa':'curta';notify('Foco concluído. Hora de uma pausa '+(T.phase==='longa'?'longa':'curta')+'.')}

  '<label class="f">A semana começa em<select id="st-ws">'+opts([['0','Domingo'],['1','Segunda-feira']],s.weekStart)+'</select></label></div>'+
  '<div class="panel stack"><h2>Conclusão e alertas</h2>'+chk('confetti','Efeito visual ao concluir tarefa')+chk('sound','Sons de conclusão e de alerta')+
  '<div class="row"><div><div class="muted" style="font-size:.85rem;margin-bottom:6px">Notificações do navegador: '+esc(np)+'</div><button class="btn sm" data-act="notif">Ativar notificações</button></div></div><div class="muted" style="font-size:.82rem">Lembretes disparam enquanto esta página estiver aberta.</div></div>'+
  '<div class="panel stack"><h2>Pomodoro (minutos)</h2><div class="row"><label class="f">Foco<input type="number" id="pm-f" min="1" value="'+s.pomo.foco+'"></label><label class="f">Pausa curta<input type="number" id="pm-c" min="1" value="'+s.pomo.curta+'"></label><label class="f">Pausa longa<input type="number" id="pm-l" min="1" value="'+s.pomo.longa+'"></label></div></div></div>'+
  '<div class="stack"><div class="panel stack"><h2>Seus dados</h2><div class="status" style="padding:0"><span class="dot '+(navigator.onLine?'':'off')+'"></span>Salvos neste navegador, funcionam sem internet.</div><div class="muted" style="font-size:.85rem">A sincronização entre computador e celular exige uma conta e um servidor. Esta versão guarda tudo localmente; use exportar e importar para levar os dados a outro aparelho.</div><div class="qa" style="flex-wrap:wrap"><button class="btn" data-act="export">Exportar dados</button><button class="btn" data-act="import">Importar dados</button></div></div>'+
  '<div class="panel stack"><h2>Zona de risco</h2><div class="muted" style="font-size:.85rem">Apaga tarefas, agenda e sessões deste navegador.</div><div><button class="btn danger" id="wipe" data-act="wipe">Apagar tudo</button></div></div></div></div>';
}
function exportDialog(){const j=JSON.stringify(state);const ov=modal({title:'Exportar dados',body:'<div class="muted" style="font-size:.88rem">Copie o texto abaixo e guarde em um arquivo. Para usar em outro aparelho, cole em Importar dados.</div><textarea id="x-j" readonly style="min-height:160px;font-family:var(--f-mono);font-size:.75rem">'+esc(j)+'</textarea><button class="btn" id="x-c" type="button">Copiar</button>'});
  $('#x-c',ov).onclick=()=>{const ta=$('#x-j',ov);ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado.'),()=>{document.execCommand('copy');toast('Copiado.')})}catch(e){try{document.execCommand('copy');toast('Copiado.')}catch(_){toast('Selecione o texto e copie.')}}}}
function importDialog(){modal({title:'Importar dados',saveLabel:'Importar',body:'<div class="muted" style="font-size:.88rem">Cole o texto exportado. Isso substitui os dados atuais.</div><textarea id="i-j" style="min-height:160px;font-family:var(--f-mono);font-size:.75rem"></textarea>',
  onSave:ov=>{try{const o=JSON.parse(val(ov,'i-j'));if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.areas))throw 0;state=o;save();applyTheme();render();toast('Dados importados.')}catch(e){toast('Texto inválido. Cole o conteúdo completo exportado.');return false}}})}
function applyTheme(){const t=state.set.theme,r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}

/* ---------- navegação e renderização ---------- */
const NAV=[['hoje','Hoje'],['tarefas','Tarefas'],['agenda','Agenda'],['estudos','Estudos'],['ajustes','Ajustes']];
function render(){
  $('#nav').innerHTML='<div class="brand">Meu Planejador<small>tarefas · agenda · estudos</small></div>'+NAV.map(n=>'<button class="nb" data-act="nav" data-v="'+n[0]+'" '+(ui.view===n[0]?'aria-current="page"':'')+'>'+ICO[n[0]]+'<span>'+n[1]+'</span></button>').join('')+'<button class="btn pri newbtn" data-act="task-new" style="margin:12px 4px 0">+ Nova tarefa <span class="mono" style="opacity:.7;font-size:.75rem">N</span></button><span class="sp"></span><div class="status"><span class="dot '+(navigator.onLine?'':'off')+'"></span>'+(navigator.onLine?'Salvo neste aparelho':'Offline · tudo salvo')+'</div>';
  const m=$('#main'),keep=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
  m.innerHTML=ui.view==='hoje'?hojeView():ui.view==='tarefas'?tarefasView():ui.view==='agenda'?'<div class="top"><div><h1>Agenda</h1><div class="muted">Compromissos e blocos de tempo</div></div></div>'+agendaView():ui.view==='estudos'?studyView():ajustesView();
  if(keep==='tf-q'){const q=$('#tf-q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}
  if(ui.view==='agenda'&&!ui.noscroll){const cal=$('.cal');if(cal&&!cal.dataset.s){cal.dataset.s=1;const body=$('.cal-body');window.scrollTo(0,0)}}
  timerTick();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id||(el.closest('[data-id]')||{dataset:{}}).dataset.id;
  if(act==='nav'){ui.view=el.dataset.v;render();window.scrollTo(0,0)}
  else if(act==='toggle')toggleTask(id,e);
  else if(act==='edit')taskDialog(taskOf(id));
  else if(act==='task-new')taskDialog();
  else if(act==='tf-view'){ui.tf.view=el.dataset.v;render()}
  else if(act==='area-new')areaDialog();
  else if(act==='go-agenda'){ui.view='agenda';render()}
  else if(act==='go-study'){ui.pre=el.dataset.sub;ui.view='estudos';render()}
  else if(act==='go-study-view'){ui.view='estudos';render()}
  else if(act==='ag-prev')shiftAgenda(-1);else if(act==='ag-next')shiftAgenda(1);
  else if(act==='ag-today'){ui.ag.date=today();render()}
  else if(act==='ag-view'){ui.ag.view=el.dataset.v;render()}
  else if(act==='ag-go'){ui.ag.date=el.dataset.d;ui.ag.view='dia';render()}
  else if(act==='ev-new')eventDialog(null,{date:ui.ag.date});
  else if(act==='ev-done'){e.stopPropagation();toggleTask(el.dataset.t,e)}
  else if(act==='ev-edit'){const ev=state.events.find(x=>x.id===id);if(ev)eventDialog(ev)}
  else if(act==='pool'){const t=taskOf(id);const s=Math.max(H0*60,Math.ceil(nowMin()/30)*30);eventDialog(null,{titulo:t.titulo,taskId:t.id,tipo:'bloco',date:ui.ag.date,start:s,end:s+(t.est||60),areaId:t.areaId})}
  else if(act==='t-mode'){ui.tmode=el.dataset.v;render()}
  else if(act==='t-start'){const s=$('#t-sub').value;timerStart(s,$('#t-top').value.trim(),ui.tmode==='livre'?'livre':'pomo')}
  else if(act==='t-toggle')timerToggle();else if(act==='t-stop')timerStop(true);else if(act==='t-discard')timerStop(false);
  else if(act==='sub-new')subjDialog();else if(act==='sub-edit')subjDialog(subjOf(id));
  else if(act==='s-manual')manualDialog();
  else if(act==='s-del'){const old=state.sessions.slice();state.sessions=state.sessions.filter(x=>x.id!==id);save();render();undo('Sessão excluída',()=>{state.sessions=old;save();render()})}
  else if(act==='clear-sample'){state.tasks=state.tasks.filter(x=>!x.ex);state.events=state.events.filter(x=>!x.ex);state.sessions=state.sessions.filter(x=>!x.ex);state.sample=false;save();render();toast('Exemplos removidos.')}
  else if(act==='theme'){state.set.theme=el.dataset.v;applyTheme();save();render()}
  else if(act==='notif'){try{Notification.requestPermission().then(()=>render())}catch(x){toast('Este navegador não permite notificações aqui.')}}
  else if(act==='export')exportDialog();else if(act==='import')importDialog();
  else if(act==='wipe'){if(el.dataset.arm){state=Object.assign(seed(),{tasks:[],events:[],sessions:[],subjects:[],sample:false,timer:null});save();render();toast('Dados apagados.')}else{el.dataset.arm=1;el.textContent='Toque de novo para confirmar'}}
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('[role=button][data-act]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click()}
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.querySelector('.ov');if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'){e.preventDefault();taskDialog()}else if(e.key==='t'){ui.view='hoje';render()}
});
document.addEventListener('input',e=>{if(e.target.id==='tf-q'){ui.tf.q=e.target.value;render()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='tf-a'){ui.tf.area=t.value;render()}else if(t.id==='tf-g'){ui.tf.tag=t.value;render()}else if(t.id==='tf-p'){ui.tf.prio=t.value;render()}
  else if(t.dataset&&t.dataset.set){state.set[t.dataset.set]=t.checked;save()}
  else if(t.id==='st-ws'){state.set.weekStart=+t.value;save()}
  else if(t.id==='pm-f'||t.id==='pm-c'||t.id==='pm-l'){const p=state.set.pomo;p.foco=Math.max(1,+$('#pm-f').value||25);p.curta=Math.max(1,+$('#pm-c').value||5);p.longa=Math.max(1,+$('#pm-l').value||15);save()}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='quick'){e.preventDefault();const v=$('#qt').value.trim();if(!v)return;state.tasks.push({id:uid(),titulo:v,desc:'',prio:2,areaId:'a-pes',tags:[],due:today(),time:'',est:0,done:false,doneAt:null,cor:'',icone:'',rec:'',rem:''});save();render();const q=$('#qt');if(q)q.focus()}
});
$('#fab').onclick=()=>taskDialog();
/* arrastar e soltar na agenda */
let drag=null;
document.addEventListener('dragstart',e=>{const ev=e.target.closest&&e.target.closest('.evb'),pl=e.target.closest&&e.target.closest('[data-act=pool]');
  if(ev)drag={k:'ev',id:ev.dataset.id,from:ev.dataset.d};else if(pl)drag={k:'task',id:pl.dataset.id};else return;try{e.dataTransfer.setData('text/plain',drag.id);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(c&&drag){e.preventDefault();$$('.col.drop').forEach(x=>x!==c&&x.classList.remove('drop'));c.classList.add('drop')}});
document.addEventListener('dragend',()=>{drag=null;$$('.col.drop').forEach(x=>x.classList.remove('drop'))});
document.addEventListener('drop',e=>{
  const c=e.target.closest&&e.target.closest('.col');if(!c||!drag)return;e.preventDefault();
  const r=c.getBoundingClientRect(),min=Math.max(H0*60,Math.min(H1*60-30,Math.round(((e.clientY-r.top)/SLOT*60+H0*60)/15)*15)),date=c.dataset.col;
  if(drag.k==='ev'){const ev=state.events.find(x=>x.id===drag.id);if(ev){const len=ev.end-ev.start;ev.start=min;ev.end=Math.min(1439,min+len);if(ev.rec&&drag.from)ev.date=date;else ev.date=date;
      const w=conflict(date,ev.start,ev.end,ev.id);save();render();if(w)toast('Atenção: este horário se sobrepõe a outro item.')}}
  else{const t=taskOf(drag.id);if(t){const len=t.est||60,w=conflict(date,min,min+len);state.events.push({id:uid(),titulo:t.titulo,date,start:min,end:Math.min(1439,min+len),tipo:'bloco',taskId:t.id,areaId:t.areaId,cor:'',rec:'',rem:t.rem||''});save();render();toast(w?'Bloco criado, mas se sobrepõe a outro item.':'Bloco criado para '+dmy(date)+' às '+hm(min))}}
  drag=null;
});
/* lembretes */
function checkReminders(){
  const now=Date.now(),td=today(),items=[];
  state.tasks.forEach(t=>{if(!t.done&&t.due&&t.time&&t.rem!==''&&t.rem!=null){const p=parseD(t.due),m=toMin(t.time);p.setHours(Math.floor(m/60),m%60);items.push({k:'t'+t.id+t.due,at:p.getTime()-(+t.rem)*60000,msg:t.titulo+(+t.rem?' em '+t.rem+' min':' agora')})}});
  [td,addDays(td,1)].forEach(d=>eventsOn(d).forEach(e=>{if(e.rem!==''&&e.rem!=null){const p=parseD(d);p.setHours(Math.floor(e.start/60),e.start%60);items.push({k:'e'+e.id+d,at:p.getTime()-(+e.rem)*60000,msg:e.titulo+(+e.rem?' começa em '+e.rem+' min':' começa agora')})}}));
  items.forEach(i=>{if(now>=i.at&&now<i.at+10*60000&&!state.fired.includes(i.k)){state.fired.push(i.k);state.fired=state.fired.slice(-200);save();notify('Lembrete: '+i.msg)}});
}
window.addEventListener('online',render);window.addEventListener('offline',render);
applyTheme();render();
setInterval(timerTick,500);setInterval(checkReminders,15000);checkReminders();
setInterval(()=>{if(ui.view==='agenda'&&!document.querySelector('.ov')&&!drag)render()},60000);
</script>

</body></html>
